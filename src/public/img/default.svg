<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#4a24e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="170" r="170" fill="url(#glow)"/>

  <!-- decorative rings -->
  <circle cx="340" cy="60" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="18"/>
  <circle cx="40" cy="360" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="22"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
    <line x1="70" y1="150" x2="115" y2="150"/>
    <line x1="55" y1="172" x2="110" y2="172"/>
    <line x1="75" y1="194" x2="112" y2="194"/>
  </g>

  <!-- dumbbell -->
  <g transform="translate(205 172) rotate(-28)" fill="#ffffff">
    <rect x="-80" y="-26" width="16" height="52" rx="5"/>
    <rect x="-62" y="-40" width="20" height="80" rx="6"/>
    <rect x="-42" y="-8"  width="84" height="16" rx="5"/>
    <rect x="42"  y="-40" width="20" height="80" rx="6"/>
    <rect x="64"  y="-26" width="16" height="52" rx="5"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="300" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="800" letter-spacing="1" fill="#ffffff">SPORTZONE</text>
  <rect x="170" y="316" width="60" height="4" rx="2" fill="#ffd84d"/>
  <text x="200" y="348" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="3" fill="#ffffff" fill-opacity="0.75">NO IMAGE YET</text>
</svg>
